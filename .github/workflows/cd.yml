name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Deploy tested commit via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -eu
            cd /var/www/claro
            test -z "$(git status --porcelain --untracked-files=normal)" || {
              echo 'Deployment stopped: preserve and resolve local server changes first.'
              exit 1
            }
            git fetch origin master
            test "$(git rev-parse origin/master)" = "$DEPLOY_SHA" || {
              echo 'Deployment skipped: a newer commit is already on master.'
              exit 0
            }
            docker compose exec -T php php artisan down
            docker compose stop scheduler worker
            git checkout --detach "$DEPLOY_SHA"
            docker compose build php scheduler worker
            docker compose run --rm --no-deps php composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            docker compose run --rm --no-deps php npm ci
            docker compose run --rm --no-deps php npm run build
            docker compose up -d --no-deps php nginx
            docker compose exec -T php php artisan config:clear
            docker compose exec -T php php artisan migrate --force
            docker compose exec -T php php artisan tasks:privatize-attachments
            docker compose exec -T php php artisan storage:link
            docker compose exec -T nginx nginx -s reload
            docker compose exec -T php php artisan up
            docker compose up -d --no-deps scheduler worker
